name: Longbridge US Stock AI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0,30 14-18 * * 1-5'
    - cron: '0 19 * * 1-5'

jobs:
  trade:
    runs-on: ubuntu-latest
    concurrency:
      group: trading-bot
      cancel-in-progress: false
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装长桥与 OpenAI 依赖库
        run: pip install -q openai longbridge

      - name: 启动 AI 盯盘机器人
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          RUN_MINUTES: "58"
        run: python bot.py
