name: Longbridge US Stock AI Bot

on:
  # 1. 允许手动点击测试运行
  workflow_dispatch:

  # 2. 改为每小时的 00 分和 30 分各触发一次防漏单（对应香港时间 21:00 - 次日 04:59）
  schedule:
    - cron: '0,30 13-20 * * 1-5'

jobs:
  trade:
    runs-on: ubuntu-latest
    # 防止任务重叠运行：如果上一轮还在跑，新触发的任务直接排队接力
    concurrency:
      group: trading-bot
      cancel-in-progress: false
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装长桥与 OpenAI 依赖库
        run: pip install -q openai longbridge

      - name: 启动 AI 盯盘机器人
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          # 改为单次连续狂跑 58 分钟（将近1小时不断线）！
          # 即使手动点一次，也能连续盯盘整整 1 小时；配合上方每 30 分钟一次的唤醒信号，实现整晚零断档接力
          RUN_MINUTES: "58"
        run: python bot.py
